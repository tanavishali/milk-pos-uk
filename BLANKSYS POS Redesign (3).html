document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

rder-top:1px solid #F0F1F3;flex-shrink:0\">\n          <div sc-camel-on-click=\"{{ closeProductForm }}\" style=\"color:#6B7280;font-weight:700;font-size:13.5px;cursor:pointer;padding:11px 16px;border-radius:8px;transition:background .15s\" style-hover=\"background:#F0F1F3\">Cancel<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ saveProduct }}\" style=\"background:#0F8A6B;color:#fff;border-radius:10px;padding:11px 22px;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .15s,transform .15s\" style-hover=\"background:#0C7259;transform:translateY(-1px)\">Save Item<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    page: 'dashboard',\n    ordersView: 'list', customersView: 'grid', productsView: 'grid',\n    orderSearch: '', orderStatusFilter: 'all',\n    customerSearch: '',\n    productSearch: '', productCategoryFilter: 'all',\n    customers: [\n      {id:1,code:'CUST-101',name:'Zainab Ahmed',phone:'+92 300 1234567',nid:'35201-1234567-1',address:'House 42-B, Model Town, Lahore'},\n      {id:2,code:'CUST-102',name:'Hamza Malik',phone:'+92 321 7654321',nid:'35202-9876543-3',address:'Street 9, Sector F-7, Islamabad'},\n      {id:3,code:'CUST-103',name:'Ayesha Tariq',phone:'+92 333 4567890',nid:'35201-4455667-5',address:'Apartment 4B, Gulberg III, Lahore'},\n      {id:4,code:'CUST-104',name:'Bilal Siddiqui',phone:'+92 312 9876541',nid:'42101-5544332-9',address:'House 12, DHA Phase 5, Karachi'},\n      {id:5,code:'CUST-105',name:'Fatima Noor',phone:'+92 345 1122334',nid:'61101-7788990-2',address:'Street 4, Bahria Town, Rawalpindi'},\n      {id:6,code:'CUST-106',name:'Usman Ghani',phone:'+92 301 9988776',nid:'35202-1122334-7',address:'House 88, Cavalry Ground, Lahore'},\n      {id:7,code:'CUST-107',name:'Sara Khan',phone:'+92 322 3344556',nid:'17301-3322114-8',address:'University Town, Peshaw :5,status:'Paid',items:[{productId:8,qty:3,price:3.20}]},\n      {id:5,txn:'TRX-8916',customerId:5,courierId:1,status:'Paid',items:[{productId:3,qty:3,price:6.00}]},\n      {id:6,txn:'TRX-8915',customerId:6,courierId:2,status:'Paid',items:[{productId:5,qty:1,price:4.20},{productId:9,qty:1,price:6.80},{productId:10,qty:1,price:9.30}]},\n      {id:7,txn:'TRX-8914',customerId:7,courierId:3,status:'Paid',items:[{productId:4,qty:2,price:3.50}]},\n      {id:8,txn:'TRX-8913',customerId:8,courierId:4,status:'On Credit',items:[{productId:6,qty:1,price:13.80}]},\n    ],\n    nextTxnNum: 8921, nextCustId: 9, nextProductId: 11,\n    showWizard: false, wizardStep: 1, wizCustomerId: null, wizItems: {}, wizCourierId: 1, wizPayment: 'cash',\n    showReceipt: false, receiptOrderId: null,\n    showCustomerForm: false, customerFormMode: 'add', customerForm: {id:null,name:'',phone:'',nid:'',address:''},\n    showCustomerDetail: false, customerDetailId: null,\n    showProductForm: false, productFormMode: 'add', productForm: {id:null,name:'',category:'Bakery & Pastry',retail:'',sale:'',qty:''},\n    loading: true,\n  };\n\n  componentDidMount(){ setTimeout(()=>this.setState({loading:false}), 700); }\n\n  fmt(n){ return '$' + Number(n||0).toFixed(2); }\n  initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }\n  statusStyle(st){ return st==='Paid' ? {bg:'#DCFCE7',color:'#15803D'} : st==='On Credit' ? {bg:'#FEF3C7',color:'#B45309'} : {bg:'#FEE2E2',color:'#B91C1C'}; }\n\n  setPageTo(p){\n    this.setState({page:p, loading:true});\n    clearTimeout(this._loadT);\n    this._loadT = setTimeout(()=>this.setState({loading:false}), 550);\n  }\n  openWizard = () => this.setState({showWizard:true, wizardStep:1, wizCustomerId:null, wizItems:{}, wizCourierId:this.state.couriers[0]?.id||null, wizPayment:'cash'});\n  closeWizard = () => this.setState({showWizard:false});\n  wizNext = () => this.setState(s=>({wizardStep:Math.min(3,s.wizardStep+1)}));\n  wizPrev = () => this.setState(s=>({wizardStep:Math.max(1,s.wizardStep-1)}));\n  setWizCustomer(id){ this.setState({wizCustomerId:id}); }\n  toggleWizItem(pid){\n    this.setState(s=>{\n      const items={...s.wizItems};\n      if(items[pid]) delete items[pid];\n      else { const p=s.products.find(x=>x.id===pid); items[pid]={qty:1,price:p.sale}; }\n      return {wizItems:items};\n    });\n  }\n  stepWizQty(pid,delta){\n    this.setState(s=>{\n      const items={...s.wizItems}; const cur=items[pid]; if(!cur) return {};\n      items[pid]={...cur, qty:Math.max(1,cur.qty+delta)}; return {wizItems:items};\n    });\n  }\n  setWizPriceVal(pid,val){\n    this.setState(s=>{\n      const items={...s.wizItems}; const cur=items[pid]; if(!cur) return {};\n      items[pid]={...cur, price:parseFloat(val)||0}; return {wizItems:items};\n    });\n  }\n  setWizCourier = (e) => this.setState({wizCourierId: parseInt(e.target.value)});\n  setWizPaymentCash = () => this.setState({wizPayment:'cash'});\n  setWizPaymentCredit = () => this.setState({wizPayment:'credit'});\n\n  confirmOrder = () => {\n    const s=this.state;\n    const items=Object.keys(s.wizItems).map(pid=>({productId:parseInt(pid),qty:s.wizItems[pid].qty,price:s.wizItems[pid].price}));\n    if(!s.wizCustomerId || items.length===0) return;\n    const newOrder={id:Date.now(),txn:'TRX-'+s.nextTxnNum,customerId:s.wizCustomerId,courierId:s.wizCourierId,status:s.wizPayment==='cash'?'Paid':'On Credit',items};\n    this.setState(st=>({orders:[newOrder,...st.orders],nextTxnNum:st.nextTxnNum+1,showWizard:false,showReceipt:true,receiptOrderId:newOrder.id}));\n  };\n\n  openReceipt(id){ this.setState({showReceipt:true, receiptOrderId:id}); }\n  closeReceipt = () => this.setState({showReceipt:false});\n  printReceipt = () => window.print();\n\n  openAddCustomer = () => this.setState({showCustomerForm:true, customerFormMode:'add', customerForm:{id:null,name:'',phone:'',nid:'',address:''}});\n  openEditCustomer(id){\n    const c=this.state.customers.find(x=>x.id===id);\n    this.setState({showCustomerForm:true, customerFormMode:'edit', customerForm:{...c}, showCustomerDetail:false});\n  }\n  setCustomerField(field,val){ this.setState(s=>({customerForm:{...s.customerForm,[field]:val}})); }\n  setCustName = (e) => this.setCustomerField('name', e.target.value);\n  setCustPhone = (e) => this.setCustomerField('phone', e.target.value);\n  setCustNid = (e) => this.setCustomerField('nid', e.target.value);\n  setCustAddress = (e) => this.setCustomerField('address', e.target.value);\n  saveCustomer = () => {\n    const s=this.state; const f=s.customerForm;\n    if(!f.name || !f.phone) return;\n    if(s.customerFormMode==='add'){\n      const newC={...f, id:s.nextCustId, code:'CUST-'+(100+s.nextCustId)};\n      this.setState(st=>({customers:[newC,...st.customers], nextCustId:st.nextCustId+1, showCustomerForm:false}));\n    } else {\n      this.setState(st=>({customers:st.customers.map(c=>c.id===f.id?{...c,...f}:c), showCustomerForm:false}));\n    }\n  };\n  deleteCustomer(id){ if(window.confirm('Delete this customer?')) this.setState(s=>({customers:s.customers.filter(c=>c.id!==id)})); }\n  viewCustomer(id){ this.setState({showCustomerDetail:true, customerDetailId:id}); }\n  closeCustomerDetail = () => this.setState({showCustomerDetail:false});\n  closeCustomerForm = () => this.setState({showCustomerForm:false});\n\n  openAddProduct = () => this.setState({showProductForm:true, productFormMode:'add', productForm:{id:null,name:'',category:'Bakery & Pastry',retail:'',sale:'',qty:''}});\n  openEditProduct(id){ const p=this.state.products.find(x=>x.id===id); this.setState({showProductForm:true, productFormMode:'edit', productForm:{...p}}); }\n  setProductField(field,val){ this.setState(s=>({productForm:{...s.productForm,[field]:val}})); }\n  setProdName = (e) => this.setProductField('name', e.target.value);\n  setProdCategory = (e) => this.setProductField('category', e.target.value);\n  setProdRetail = (e) => this.setProductField('retail', e.target.value);\n  setProdSale = (e) => this.setProductField('sale', e.target.value);\n  setProdQty = (e) => this.setProductField('qty', e.target.value);\n  saveProduct = () => {\n    const s=this.state; const f=s.productForm;\n    if(!f.name) return;\n    const parsed={...f, retail:parseFloat(f.retail)||0, sale:parseFloat(f.sale)||0, qty:parseInt(f.qty)||0};\n    if(s.productFormMode==='add'){\n      this.setState(st=>({products:[{...parsed,id:st.nextProductId},...st.products], nextProductId:st.nextProductId+1, showProductForm:false}));\n    } else {\n      this.setState(st=>({products:st.products.map(p=>p.id===parsed.id?parsed:p), showProductForm:false}));\n    }\n  };\n  deleteProduct(id){ if(window.confirm('Delete this item?')) this.setState(s=>({products:s.products.filter(p=>p.id!==id)})); }\n  closeProductForm = () => this.setState({showProductForm:false});\n\n  renderVals(){\n    const s=this.state;\n    const activeBg='rgba(255,255,255,0.07)', activeBorder='#0F8A6B', activeColor='#fff';\n    const inactiveBorder='transparent', inactiveColor='#9AA1AE';\n    const navBg={}, navBorder={}, navColor={};\n    ['dashboard','orders','customers','products'].forEach(p=>{\n      const on = s.page===p;\n      navBg[p]= on?activeBg:'transparent';\n      navBorder[p]= on?activeBorder:inactiveBorder;\n      navColor[p]= on?activeColor:inactiveColor;\n    });\n    const setPage = {\n      dashboard: () => this.setPageTo('dashboard'),\n      orders: () => this.setPageTo('orders'),\n      customers: () => this.setPageTo('customers'),\n      products: () => this.setPageTo('products'),\n    };\n\n    const pageTitles={dashboard:'Dashboard',orders:'Customer Orders',customers:'Customers Directory',products:'Master Items'};\n\n    const toggleBtn=(active)=>({display:'flex',alignItems:'center',justifyContent:'center',width:'34px',height:'30px',borderRadius:'8px',cursor:'pointer',background:active?'#fff':'transparent',color:active?'#0F8A6B':'#8A9099',boxShadow:active?'0 1px productCategoryFilter) && (!pq||p.name.toLowerCase().includes(pq))).map(p=>{\n      const low = p.qty<=15, mid = p.qty>15 && p.qty<=35;\n      const stockColor = low?'#DC2626':mid?'#D97706':'#0F8A6B';\n      const stockBg = low?'#FDECEC':mid?'#FEF3C7':'#E7F5EF';\n      const stockLabel = low?'Low Stock':mid?'In Stock':'Well Stocked';\n      return {...p, retailFmt:this.fmt(p.retail), saleFmt:this.fmt(p.sale),\n        stockColor, stockBg, stockLabel, stockPct:Math.max(6,Math.round((p.qty/maxQty)*100)),\n        edit:()=>this.openEditProduct(p.id), remove:()=>this.deleteProduct(p.id)};\n    });\n\n    // DASHBOARD\n    const grossProfit = ordersFull.reduce((a,o)=>a+o.total,0);\n    const latestTransactions = ordersFull.slice(0,4);\n    const popularItems=[\n      {name:'Belgian Chocolate Fudge Cake', sales:142, pct:100},\n      {name:'Red Velvet Pastry Pack', sales:98, pct:69},\n      {name:'Artisan Sourdough Loaf', sales:76, pct:53},\n    ];\n    const inStock = s.products.reduce((a,p)=>a+p.qty,0);\n    const dispatched=52;\n    const dispatchedPct = Math.round((dispatched/(dispatched+inStock))*100);\n\n    // WIZARD\n    const wizCustomers = s.customers.map(c=>{\n      const sel = c.id===s.wizCustomerId;\n      return {...c, select:()=>this.setWizCustomer(c.id),\n        rowStyle:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 16px',borderRadius:'12px',cursor:'pointer',border:'1.5px solid '+(sel?'#0F8A6B':'#E6E8EC'),background:sel?'#EAF6F1':'#fff',transition:'box-shadow .15s,border-color .15s'},\n        checkStyle:{width:'20px',height:'20px',borderRadius:'50%',border:'1.5px solid '+(sel?'#0F8A6B':'#D6D9DE'),background:sel?'#0F8A6B':'transparent',flexShrink:0},\n      };\n    });\n    const selectedWizCustomer = s.customers.find(c=>c.id===s.wizCustomerId);\n    const wizProducts = s.products.map(p=>{\n      const cur=s.wizItems[p.id];\n      const sel=!!cur;\n      const qty=cur?cur.qty:1;\n      const price=cur?cur.price:p.sale;\n      return {id:p.id, name:p.name, category:p.category, stock:p.qty, standardPriceFmt:this.fmt(p.sale),\n        selected:sel, qty, price, lineTotal:this.fmt(sel?price*qty:0),\n        toggle:()=>this.toggleWizItem(p.id), dec:()=>this.stepWizQty(p.id,-1), inc:()=>this.stepWizQty(p.id,1),\n        setPrice:(e)=>this.setWizPriceVal(p.id, e.target.value),\n        rowStyle:{border:'1.5px solid '+(sel?'#0F8A6B':'#E6E8EC'),background:sel?'#EAF6F1':'#fff',borderRadius:'12px',padding:'14px 16px'},\n        checkStyle:{width:'20px',height:'20px',borderRadius:'6px',border:'1.5px solid '+(sel?'#0F8A6B':'#D6D9DE'),background:sel?'#0F8A6B':'transparent',flexShrink:0},\n      };\n    });\n    const wizCartCount = Object.values(s.wizItems).reduce((a,it)=>a+it.qty,0);\n    const wizTotal = Object.values(s.wizItems).reduce((a,it)=>a+it.qty*it.price,0);\n    const canContinue = s.wizardStep===1 ? !!s.wizCustomerId : s.wizardStep===2 ? wizCartCount>0 : true;\n    const wizContinueStyle={background: canContinue?'#0F8A6B':'#CBD5D9', color:'#fff', borderRadius:'10px', padding:'11px 22px', fontWeight:700, fontSize:'13.5px', cursor: canContinue?'pointer':'not-allowed'};\n\n    const stepCircle=(n)=>{\n      const done = s.wizardStep>n, cur = s.wizardStep===n;\n      return {width:'26px',height:'26px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',fontWeight:700,\n        background: done?'#0F8A6B':cur?'#0F8A6B':'#F0F1F3', color: (done||cur)?'#fff':'#8A9099'};\n    };\n\n    const paySeg=(active)=>({display:'flex',alignItems:'center',gap:'10px',border:'1.5px solid '+(active?'#0F8A6B':'#E6E8EC'),background:active?'#EAF6F1':'#fff',borderRadius:'10px',padding:'14px 16px',cursor:'pointer'});\n    const payDot=(active)=>({width:'16px',height:'16px',borderRadius:'50%',border:'2px solid '+(active?'#0F8A6B':'#D6D9DE'),background:active?'#0F8A6B':'transparent',flexShrink:0});\n\n    // RECEIPT\n    let receipt=null;\n    if(s.receiptOrderId){\n      const orig=s.orders.find(x=>x.id===s.receiptOrderId);\n      const full=ordersFull.find(x=>x.id===s.receiptOrderId);\n      if(orig && full){\n        const custFull = s.customers.find(c=>c.id===orig.customerId)||{};\n        receipt={\n          txn:full.txn, customerName:full.customerName, customerPhone:full.customerPhone, address:custFull.address||'',\n          courierName:full.courierName, status:full.status, statusColor:full.statusColor,\n          items: orig.items.map(it=>{ const p=s.products.find(x=>x.id===it.productId)||{name:'Item'};\n            return {name:p.name, qty:it.qty, price:this.fmt(it.price), lineTotal:this.fmt(it.qty*it.price)}; }),\n          total: this.fmt(full.total),\n        };\n      }\n    }\n\n    let customerDetail=null;\n    if(s.customerDetailId){\n      const c=s.customers.find(x=>x.id===s.customerDetailId);\n      if(c) customerDetail={...c, initials:this.initials(c.name), editFromDetail:()=>this.openEditCustomer(c.id)};\n    }\n\n    return {\n      page:s.page, loading:s.loading, skeletonBoxes:[1,2,3,4,5,6],\n      isDashboard:s.page==='dashboard' && !s.loading, isOrders:s.page==='orders' && !s.loading, isCustomers:s.page==='customers' && !s.loading, isProducts:s.page==='products' && !s.loading,\n      pageTitle: pageTitles[s.page],\n      setPage, navBg, navBorder, navColor,\n\n      ordersView:s.ordersView, ordersIsList:s.ordersView==='list', ordersIsGrid:s.ordersView==='grid',\n      setOrdersView:{list:()=>this.setState({ordersView:'list'}), grid:()=>this.setState({ordersView:'grid'})},\n      ordersListBtnStyle: toggleBtn(s.ordersView==='list'), ordersGridBtnStyle: toggleBtn(s.ordersView==='grid'),\n      orderSearch:s.orderSearch, setOrderSearch:(e)=>this.setState({orderSearch:e.target.value}),\n      orderStatusFilter:s.orderStatusFilter, setOrderStatusFilter:(e)=>this.setState({orderStatusFilter:e.target.value}),\n      filteredOrders, openWizard:this.openWizard,\n\n      customersView:s.customersView,\n      setCustomer    showReceipt:s.showReceipt, closeReceipt:this.closeReceipt, receipt, printReceipt:this.printReceipt,\n\n      showCustomerForm:s.showCustomerForm, customerFormTitle: s.customerFormMode==='add'?'Add New Customer':'Edit Customer', customerForm:s.customerForm,\n      setCustName:this.setCustName, setCustPhone:this.setCustPhone, setCustNid:this.setCustNid, setCustAddress:this.setCustAddress,\n      saveCustomer:this.saveCustomer, closeCustomerForm:this.closeCustomerForm,\n\n      showCustomerDetail:s.showCustomerDetail, closeCustomerDetail:this.closeCustomerDetail, customerDetail,\n\n      showProductForm:s.showProductForm, productFormTitle: s.productFormMode==='add'?'Add Master Item':'Edit Master Item', productForm:s.productForm,\n      setProdName:this.setProdName, setProdCategory:this.setProdCategory, setProdRetail:this.setProdRetail, setProdSale:this.setProdSale, setProdQty:this.setProdQty,\n      saveProduct:this.saveProduct, closeProductForm:this.closeProductForm,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
